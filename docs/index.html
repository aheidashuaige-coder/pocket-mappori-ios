<head><script>(function () {
  var events = [];
  var finished = false;
  var storageKey = "pocket-mappori:startup-diagnostics";
  var mode = document.documentElement.dataset.startupMode || "normal";
  function assetPath(value) {
    try {
      var url = new URL(value, location.href);
      if (url.origin !== location.origin) return undefined;
      return /^\/(assets\/[\w.-]+\.(js|css)|index\.html|compat\.html)$/.test(
        url.pathname,
      )
        ? url.pathname
        : undefined;
    } catch (_) {
      return undefined;
    }
  }
  function trace() {
    return {
      mode: mode,
      stages: window.__pocketStartupTrace || [],
      issues: window.__pocketStartupIssues || [],
      events: events.slice(),
    };
  }
  function record(type, error, asset) {
    if (
      finished ||
      (!document.getElementById("startup-shell") &&
        document.readyState === "complete")
    )
      return;
    var frames = [];
    if (error && typeof error.stack === "string") {
      frames = (
        error.stack.match(/\/assets\/[\w.-]+\.js:\d+:\d+/g) || []
      ).slice(0, 10);
    }
    events.push({
      type: type,
      atMs: Math.round(performance.now()),
      errorType:
        error &&
        /^(Error|TypeError|ReferenceError|SyntaxError|RangeError|SecurityError|NotSupportedError|AbortError)$/.test(
          error.name,
        )
          ? error.name
          : undefined,
      asset: assetPath(asset || ""),
      frames: frames,
    });
    if (events.length > 50) events.shift();
  }
  window.__pocketStartupDiagnostic = record;
  window.__pocketRevealStartupLog = function () {
    var button = document.getElementById("startup-log");
    if (button && !finished) button.hidden = false;
  };
  window.addEventListener(
    "error",
    function (event) {
      if (event.target === window)
        record("javascript-error", event.error, event.filename);
      else {
        var element = event.target;
        if (
          element &&
          (element.tagName === "SCRIPT" || element.tagName === "LINK")
        )
          record("resource-error", null, element.src || element.href);
      }
    },
    true,
  );
  window.addEventListener("unhandledrejection", function (event) {
    record("unhandled-rejection", event.reason);
  });
  window.addEventListener("vite:preloadError", function (event) {
    record("module-preload-error", event.payload);
  });

    if (finished) return;
    try {
      sessionStorage.setItem(storageKey, JSON.stringify(trace()));
    } catch (_) {}
  });
  document.addEventListener("click", function (event) {
    if (!event.target || event.target.id !== "startup-log") return;
    var button = event.target;
    if (button.hidden || button.disabled) return;
    button.disabled = true;
    var status = document.getElementById("startup-log-status");
    function exportLog(device) {
      var previous;
      try {
        previous = JSON.parse(sessionStorage.getItem(storageKey) || "null");
      } catch (_) {}
      var resources = performance
        .getEntriesByType("resource")
        .map(function (entry) {
          var path = assetPath(entry.name);
          return path
            ? {
                path: path,
                ms: Math.round(entry.duration),
                bytes: entry.encodedBodySize,
                status: entry.responseStatus,
              }
            : null;
        })
        .filter(Boolean)
        .slice(-60);
      var json = JSON.stringify(
        {
          format: 1,
          device: device,
          userAgent: navigator.userAgent,
          viewport: {
            width: innerWidth,
            height: innerHeight,
            scale: devicePixelRatio,
          },
          attempt: trace(),
          previousAttempt: previous,
          resources: resources,
        },
        null,
        2,
      );
      var name =
        "Pocket-Mappori-startup-" +
        new Date().toISOString().replace(/[:.]/g, "-") +
        ".json";
      if (nativeSend) {
        var bytes = new TextEncoder().encode(json);
        var encoded = "";
        for (var i = 0; i < bytes.length; i++)
          encoded += String.fromCharCode(bytes[i]);
        return nativeSend("beginExport", { bytes: bytes.length }).then(
          function () {
            return nativeSend("appendExport", { data: btoa(encoded) })
              .then(function () {
                return nativeSend("finishExport", { name: name });
              })
              .finally(function () {
                return nativeSend("clearTransfer", {}).catch(function () {});
              });
          },
        );
      }
      var url = URL.createObjectURL(
        new Blob([json], { type: "application/json" }),
      );
      var link = document.createElement("a");
      link.href = url;
      link.download = name;
      link.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
      }, 1000);
      return Promise.resolve();
    }
    var native = window.Capacitor;
    var nativeSend =
      native &&
      native.getPlatform &&
      native.getPlatform() === "android" &&
      native.nativePromise
        ? function (method, options) {
            return native.nativePromise("SaveFiles", method, options);
          }
        : null;
    (nativeSend
      ? nativeSend("startupDevice", {}).catch(function () {})
      : Promise.resolve()
    )
      .then(exportLog)
      .then(
        function (result) {
          status.hidden = !!(result && result.cancelled);
          status.textContent = status.hidden ? "" : "启动日志已导出。";
        },
        function () {
          status.hidden = false;
          status.textContent = "启动日志导出失败，请重试。";
        },
      )
      .finally(function () {
        button.disabled = false;
      });
  });
  window.__pocketStartupDiagnosticReady = function () {
    finished = true;
    try {
      sessionStorage.removeItem(storageKey);
    } catch (_) {}
  };
  record("shell-script");
})();
</script>
